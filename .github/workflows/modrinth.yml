name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew

      - name: Build mod jar
        run: ./gradlew build

      - name: Publish to Modrinth
        uses: Kirigami/minotaur@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project-id: tZrqbyEl
          version-name: ${{ github.event.release.name || github.ref_name }}
          version-number: ${{ github.event.release.tag_name || github.ref_name }}
          changelog: ${{ github.event.release.body }}
          game-versions: |
            1.21.1
          loaders: |
            neoforge
          files: |
            build/libs/zangetsu-*.jar
